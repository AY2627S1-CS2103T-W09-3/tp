plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
}

run {
    // JavaExec does not enable assertions by default.
    enableAssertions = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    // Gradle enables assertions for Test tasks by default; keep this explicit.
    enableAssertions = true
    // Run JavaFX UI tests without opening windows or requiring a display on CI.
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
    doFirst {
        // JDKs bundled with JavaFX must load Monocle in the same module as Glass.
        def monocle = configurations.testRuntimeClasspath.find { it.name.startsWith('openjfx-monocle-') }
        jvmArgs '--patch-module', "javafx.graphics=${monocle}"
    }
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

// When building a release JAR for one platform, pass -PjavafxPlatform=<classifier>
// (win, linux, mac, mac-aarch64) so only that platform's JavaFX natives are bundled.
// Without the property, all desktop classifiers are included for development and testing.
String javafxPlatform = findProperty('javafxPlatform')

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    List<String> javafxClassifiers = javafxPlatform != null
            ? [javafxPlatform]
            : ['win', 'mac', 'linux']
    javafxClassifiers.each { classifier ->
        ['base', 'controls', 'fxml', 'graphics'].each { module ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${classifier}"
        }
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testRuntimeOnly 'org.testfx:openjfx-monocle:17.0.10'
}

shadowJar {
    // Release JARs are built per platform with -PjavafxPlatform=<classifier>;
    // each gets a platform-suffixed name. The default name is for development.
    archiveFileName = javafxPlatform != null
            ? "estatebookultrapromax-${javafxPlatform}.jar"
            : 'estatebookultrapromax.jar'
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

defaultTasks 'clean', 'test'
